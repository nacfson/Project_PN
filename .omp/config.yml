# Project PN — Oh My Pi harness settings.
#
# Tool permissions (updated 2026-10-10):
#   - approvalMode `yolo` auto-approves read / write / exec tiers
#   - every built-in tool is also explicitly `allow` so prompts stay off
#     even if approvalMode is tightened later
tools:
  approvalMode: yolo
  approval:
    read: allow
    bash: allow
    edit: allow
    ast_grep: allow
    ast_edit: allow
    ask: allow
    debug: allow
    ida: allow
    eval: allow
    github: allow
    glob: allow
    grep: allow
    find: allow
    lsp: allow
    checkpoint: allow
    rewind: allow
    context_notes: allow
    new_context: allow
    security_scan: allow
    task: allow
    wait: allow
    todo: allow
    web_search: allow
    write: allow
    memory_edit: allow
    retain: allow
    recall: allow
    reflect: allow
    learn: allow
    manage_skill: allow
