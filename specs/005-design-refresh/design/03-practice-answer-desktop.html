<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Project PN — Review session</title>
<script src="2832b3c9-68d2-437c-bd71-fbafe8012afa"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
</style>
<style>
body{margin:0}
a{color:#2846C4;text-decoration:none}a:hover{color:#1C3399}
.rate{flex:1 1 140px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;min-height:44px;border-radius:12px;border:1px solid #D9D9D3;background:#FFFFFF;font-family:inherit;color:#17181B;cursor:pointer;text-align:left}
.rate:hover{border-color:#17181B}
.rate.good{background:#17181B;border-color:#17181B;color:#FFFFFF}
.rate.good:hover{background:#2E3036}
.rate .k{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;opacity:.6}
.reveal{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:12px;border:0;background:#17181B;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.reveal:hover{background:#2E3036}
.quiet{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#4A4C53;font-family:inherit;font-size:14px;cursor:pointer}
.quiet:hover{background:#ECECE8;color:#17181B}
.say{width:36px;height:36px;border-radius:18px;border:1px solid #D9D9D3;background:#FFFFFF;color:#17181B;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.say:hover{border-color:#17181B}
kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid currentColor;opacity:.65}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F6F6F3; color: #17181B; font-family: 'Geist', 'IBM Plex Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <header style="box-sizing: border-box; width: 100%; max-width: 760px; margin: 0 auto; padding: 24px 32px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a class="quiet" href="Main.dc.html"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>End session</a>
      <span style="font-size: 14px; color: #5E6068; font-variant-numeric: tabular-nums">{{position}} of 16</span>
    </div>
    <div role="progressbar" aria-valuemin="0" aria-valuemax="16" aria-valuenow="{{done}}" aria-label="Session progress" style="height: 3px; border-radius: 2px; background: #E4E4DF">
      <div style="width: {{progressWidth}}; height: 3px; border-radius: 2px; background: #2846C4"></div>
    </div>
  </header>
  <main style="flex: 1; box-sizing: border-box; width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 32px 64px; display: flex; flex-direction: column; gap: 20px">
    <article style="background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 16px; padding: 48px 48px 40px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <span style="font-size: 13px; color: #5E6068">{{card.pos}}</span>
        <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 56px; line-height: 1.05; letter-spacing: -0.01em">{{card.word}}</h1>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; color: #5E6068">{{card.ipa}}</span>
          <button class="say" type="button" aria-label="Play pronunciation"><svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4h3l4 3V7L8 10z"></path><path d="M16 9.5a3.5 3.5 0 0 1 0 5"></path></svg></button>
        </div>
      </div>
      <sc-if value="{{revealed}}" hint-placeholder-val="{{ true }}">
        <div style="border-top: 1px solid #E4E4DF; padding-top: 28px; display: flex; flex-direction: column; gap: 18px">
          <p style="margin: 0; font-size: 28px; font-weight: 500; text-align: center">{{card.ko}}</p>
          <p style="margin: 0; font-size: 15px; color: #5E6068; text-align: center">{{card.def}}</p>
          <blockquote style="margin: 8px 0 0; padding: 16px 20px; background: #F6F6F3; border-radius: 10px; font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 1.45; text-align: center">{{card.exBefore}}<strong style="font-weight: 500; color: #2846C4">{{card.exWord}}</strong>{{card.exAfter}}</blockquote>
        </div>
      </sc-if>
      <sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; justify-content: center; padding-top: 8px">
          <button class="reveal" type="button" sc-camel-on-click="{{reveal}}">Show answer <kbd>Space</kbd></button>
        </div>
      </sc-if>
    </article>
    <sc-if value="{{revealed}}" hint-placeholder-val="{{ true }}">
      <section aria-label="How well did you remember it?" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{ratings}}" as="r" hint-placeholder-count="4">
            <button class="{{r.cls}}" type="button" sc-camel-on-click="{{r.pick}}">
              <span style="display: flex; width: 100%; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 500">{{r.label}}</span><span class="k">{{r.key}}</span></span>
              <span style="font-size: 13px; opacity: .7">{{r.next}}</span>
            </button>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 13px; color: #5E6068; text-align: center">Press 1–4 to rate. Good is the right answer most of the time.</p>
      </section>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, revealed: true };
  }
  renderVals() {
    const cards = [
      { word: 'resilient', pos: 'adjective', ipa: '/rɪˈzɪliənt/', ko: '회복력 있는', def: 'Able to recover quickly from difficulty.', exBefore: 'Children are often remarkably ', exWord: 'resilient', exAfter: '.' },
      { word: 'mitigate', pos: 'verb', ipa: '/ˈmɪtɪɡeɪt/', ko: '완화하다', def: 'Make something less severe or painful.', exBefore: 'Retries ', exWord: 'mitigate', exAfter: ' transient network failures.' },
      { word: 'latency', pos: 'noun', ipa: '/ˈleɪtənsi/', ko: '지연 시간', def: 'The delay before a transfer of data begins.', exBefore: 'The new cache cut ', exWord: 'latency', exAfter: ' in half.' }
    ];
    const i = this.state.i % cards.length;
    const next = () => this.setState({ i: this.state.i + 1, revealed: false });
    const done = this.state.i;
    return {
      card: cards[i],
      revealed: this.state.revealed,
      hidden: !this.state.revealed,
      reveal: () => this.setState({ revealed: true }),
      done: done,
      position: Math.min(done + 1, 16),
      progressWidth: Math.round((done / 16) * 100) + '%',
      ratings: [
        { label: 'Forgot', key: '1', next: 'In 1 min', cls: 'rate', pick: next },
        { label: 'Hard', key: '2', next: 'In 6 min', cls: 'rate', pick: next },
        { label: 'Good', key: '3', next: 'In 2 days', cls: 'rate good', pick: next },
        { label: 'Easy', key: '4', next: 'In 8 days', cls: 'rate', pick: next }
      ]
    };
  }
}
</script>
</body></html>
