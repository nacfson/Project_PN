<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Project PN — Words</title>
<script src="ba1f877d-9748-47c2-8128-e954738015e1"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
</style>
<style>
body{margin:0}
a{color:#2846C4;text-decoration:none}a:hover{color:#1C3399}
.nav{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;color:#5E6068;font-size:14px;font-weight:500}
.nav:hover{background:#ECECE8;color:#17181B}
.nav.on{color:#17181B;background:#ECECE8}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:500;font-family:inherit;border:0;cursor:pointer;background:transparent;color:#17181B;box-shadow:inset 0 0 0 1px #D9D9D3}
.btn:hover{background:#ECECE8}
.tab{height:32px;padding:0 12px;border-radius:8px;border:0;background:transparent;font-family:inherit;font-size:14px;color:#4A4C53;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:#ECECE8;color:#17181B}
.tab.on{background:#17181B;color:#FFFFFF}
.wrow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(110px,1fr) 96px 120px 72px;align-items:center;gap:16px;padding:14px 12px;border-bottom:1px solid #E4E4DF;color:#17181B}
.wrow:hover{background:#FFFFFF;color:#17181B}
.wrow .acts{opacity:0}.wrow:hover .acts{opacity:1}
.icon{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#5E6068;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon:hover{background:#ECECE8;color:#17181B}
input:focus{outline:2px solid #2846C4;outline-offset:-1px}
@media (max-width: 720px){.wrow{grid-template-columns:1fr auto}.wrow .hide-sm{display:none}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F6F3; color: #17181B; font-family: 'Geist', 'IBM Plex Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <nav aria-label="Main" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #E4E4DF; display: flex; flex-direction: column; gap: 28px">
    <a href="Main.dc.html" style="padding: 0 12px; color: #17181B; font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1">PN</a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a class="nav" href="Main.dc.html">Today</a>
      <a class="nav on" href="Words.dc.html" aria-current="page">Words</a>
      <a class="nav" href="Add.dc.html">Add</a>
      <a class="nav" href="Practice.dc.html">Practice</a>
      <a class="nav" href="Settings.dc.html">Settings</a>
    </div>
    <div style="margin-top: auto; padding: 0 12px; font-size: 13px; color: #5E6068">English → Korean</div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 56px 32px 80px">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Words</h1>
          <p style="margin: 0; font-size: 14px; color: #5E6068">16 words in 1 deck</p>
        </div>
        <div style="display: flex; gap: 8px">
          <button class="btn" type="button" aria-haspopup="listbox">All decks <svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button class="btn" type="button">New deck</button>
        </div>
      </header>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <label style="position: relative; display: block">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search your words</span>
          <svg aria-hidden="true" style="position: absolute; left: 14px; top: 13px" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E6068" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>
          <input type="search" placeholder="Search words or meanings" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 48px 0 42px; border: 1px solid #D9D9D3; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #17181B">
          <kbd style="position: absolute; right: 12px; top: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 3px 7px; border-radius: 5px; border: 1px solid #D9D9D3; color: #5E6068">/</kbd>
        </label>
        <div role="tablist" aria-label="Filter by stage" style="display: flex; flex-wrap: wrap; gap: 4px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
            <button role="tab" class="{{f.cls}}" type="button" aria-selected="{{f.sel}}">{{f.label}} <span style="opacity: .7; font-variant-numeric: tabular-nums">{{f.count}}</span></button>
          </sc-for>
        </div>
      </div>
      <div>
        <div class="wrow" style="padding-top: 0; padding-bottom: 10px; font-size: 12px; color: #5E6068; background: transparent">
          <span>Word</span><span class="hide-sm">Meaning</span><span class="hide-sm">Type</span><span>Stage</span><span class="hide-sm" style="text-align: right">Due</span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid #E4E4DF">
          <sc-for list="{{words}}" as="w" hint-placeholder-count="10">
            <li>
              <a class="wrow" href="#">
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                  <span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.2">{{w.word}}</span>
                  <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #5E6068">{{w.ipa}}</span>
                </span>
                <span class="hide-sm" style="font-size: 15px">{{w.ko}}</span>
                <span class="hide-sm" style="font-size: 13px; color: #5E6068">{{w.pos}}</span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #C4C6CC"></span>New</span>
                <span class="hide-sm" style="font-size: 13px; color: #5E6068; text-align: right">Today</span>
              </a>
            </li>
          </sc-for>
        </ul>
        <p style="margin: 16px 0 0; font-size: 13px; color: #5E6068">Hover a row to play audio, move it to another deck, or delete it. Open a word for everything else.</p>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}">
class Component extends DCLogic {
  renderVals() {
    const f = (label, count, on) => ({ label, count, sel: on ? 'true' : 'false', cls: on ? 'tab on' : 'tab' });
    return {
      filters: [f('All', 16, true), f('New', 16), f('Learning', 0), f('Recognized', 0), f('Recalled', 0), f('Usable', 0), f('Mastered', 0)],
      words: [
        { word: 'pragmatic', ipa: '/præɡˈmætɪk/', ko: '실용적인', pos: 'adjective' },
        { word: 'candid', ipa: '/ˈkændɪd/', ko: '솔직한', pos: 'adjective' },
        { word: 'leverage', ipa: '/ˈlevərɪdʒ/', ko: '활용하다', pos: 'verb' },
        { word: 'inevitable', ipa: '/ɪnˈevɪtəbl/', ko: '불가피한', pos: 'adjective' },
        { word: 'concise', ipa: '/kənˈsaɪs/', ko: '간결한', pos: 'adjective' },
        { word: 'persist', ipa: '/pərˈsɪst/', ko: '지속하다', pos: 'verb' },
        { word: 'scrutinize', ipa: '/ˈskruːtənaɪz/', ko: '면밀히 조사하다', pos: 'verb' },
        { word: 'feasible', ipa: '/ˈfiːzəbl/', ko: '실현 가능한', pos: 'adjective' },
        { word: 'ambiguous', ipa: '/æmˈbɪɡjuəs/', ko: '모호한', pos: 'adjective' },
        { word: 'latency', ipa: '/ˈleɪtənsi/', ko: '지연 시간', pos: 'noun' }
      ]
    };
  }
}
</script>
</body></html>
