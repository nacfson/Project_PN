<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Project PN — Add a word</title>
<script src="6bb94b63-e614-4511-998e-c2e6312ee824"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
</style>
<style>
body{margin:0}
a{color:#2846C4;text-decoration:none}a:hover{color:#1C3399}
.nav{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;color:#5E6068;font-size:14px;font-weight:500}
.nav:hover{background:#ECECE8;color:#17181B}
.nav.on{color:#17181B;background:#ECECE8}
.seg{height:34px;padding:0 14px;border-radius:7px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:#4A4C53;cursor:pointer}
.seg.on{background:#FFFFFF;color:#17181B;box-shadow:0 1px 2px rgba(23,24,27,.08),0 0 0 1px #E4E4DF}
.field{width:100%;box-sizing:border-box;border:1px solid #D9D9D3;border-radius:10px;background:#FFFFFF;font-family:inherit;font-size:15px;color:#17181B;padding:0 14px;height:44px}
.field:focus{outline:2px solid #2846C4;outline-offset:-1px;border-color:#2846C4}
.primary{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px;border-radius:12px;border:0;background:#17181B;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.primary:hover{background:#2E3036}
.sense{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid #E4E4DF;border-radius:12px;background:#FFFFFF;cursor:pointer}
.sense:hover{border-color:#B9BAB4}
.sense.on{border-color:#17181B;box-shadow:inset 0 0 0 1px #17181B}
summary{cursor:pointer;font-size:14px;font-weight:500;color:#17181B;list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
summary::-webkit-details-marker{display:none}
label span.l{font-size:13px;font-weight:500;color:#17181B}
kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid currentColor;opacity:.65}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F6F3; color: #17181B; font-family: 'Geist', 'IBM Plex Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <nav aria-label="Main" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #E4E4DF; display: flex; flex-direction: column; gap: 28px">
    <a href="Main.dc.html" style="padding: 0 12px; color: #17181B; font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1">PN</a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a class="nav" href="Main.dc.html">Today</a>
      <a class="nav" href="Words.dc.html">Words</a>
      <a class="nav on" href="Add.dc.html" aria-current="page">Add</a>
      <a class="nav" href="Practice.dc.html">Practice</a>
      <a class="nav" href="Settings.dc.html">Settings</a>
    </div>
    <div style="margin-top: auto; padding: 0 12px; font-size: 13px; color: #5E6068">English → Korean</div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 56px 32px 80px">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Add a word</h1>
          <p style="margin: 0; font-size: 14px; color: #5E6068">Adding to <button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: #17181B; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">en (Default)</button></p>
        </div>
        <div role="tablist" aria-label="Add method" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #ECECE8">
          <button role="tab" aria-selected="true" class="seg on" type="button">Word or phrase</button>
          <button role="tab" aria-selected="false" class="seg" type="button">From a passage</button>
        </div>
      </header>
      <section style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <label style="flex: 1 1 320px; display: block">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Word or phrase</span>
            <input class="field" value="resilient" placeholder="A word or phrase, e.g. look up" style="height: 52px; font-family: 'Newsreader', Georgia, serif; font-size: 22px">
          </label>
          <button class="primary" type="button">Find meanings <kbd>Enter</kbd></button>
        </div>
        <details>
          <summary><svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>Add context <span style="font-weight: 400; color: #5E6068">— optional, helps pick the right meaning</span></summary>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px; padding-top: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1"><span class="l">Where you saw it</span><input class="field" placeholder="The sentence it came from"></label>
            <label style="display: flex; flex-direction: column; gap: 6px"><span class="l">Your own wording</span><input class="field" placeholder="Shown on your cards only"></label>
            <label style="display: flex; flex-direction: column; gap: 6px"><span class="l">Part of speech</span>
              <sc-raw-select class="field"><option>Any</option><option>noun</option><option>verb</option><option>adjective</option><option>adverb</option><option>phrase</option><option>other…</option></sc-raw-select>
            </label>
          </div>
        </details>
      </section>
      <section aria-label="Meanings" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600">Which meaning did you mean?</h2>
          <span style="font-size: 13px; color: #5E6068">2 found</span>
        </div>
        <div role="radiogroup" aria-label="Meanings of resilient" style="display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{senses}}" as="s" hint-placeholder-count="2">
            <label class="{{s.cls}}">
              <input type="radio" name="sense" checked="{{s.checked}}" sc-camel-on-change="{{s.pick}}" style="margin: 3px 0 0; width: 18px; height: 18px; accent-color: #17181B">
              <span style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
                <span style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px"><span style="font-size: 17px; font-weight: 500">{{s.ko}}</span><span style="font-size: 13px; color: #5E6068">{{s.pos}} · {{s.level}}</span></span>
                <span style="font-size: 14px; color: #4A4C53">{{s.def}}</span>
                <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; color: #4A4C53">“{{s.ex}}”</span>
              </span>
            </label>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px">
          <button type="button" style="border: 0; background: transparent; padding: 0; min-height: 44px; font: inherit; font-size: 14px; color: #2846C4; cursor: pointer">None of these — search again</button>
          <button class="primary" type="button" style="height: 44px">Add to deck</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const raw = [
      { ko: '회복력 있는', pos: 'adjective', level: 'B2', def: 'Able to recover quickly from difficulty.', ex: 'Children are often remarkably resilient.' },
      { ko: '탄력 있는', pos: 'adjective', level: 'C1', def: 'Able to spring back into shape after bending or stretching.', ex: 'A resilient rubber seal keeps the water out.' }
    ];
    return {
      senses: raw.map((s, i) => ({
        ...s,
        checked: this.state.picked === i,
        cls: this.state.picked === i ? 'sense on' : 'sense',
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
</body></html>
