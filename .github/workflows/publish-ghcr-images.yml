name: Publish Project PN images

# Validates and publishes backend + frontend images to GHCR on push to main or manual dispatch.
#
# Preflight gate:
# 1. Statically lints module imports across all workspaces.
# 2. Builds and validates the frontend web bundle with Expo Metro.
# Only when all preflight checks AND the quality gates pass are the Docker images built and published.
# Pull requests are validated by quality-gates.yml, not by this workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Images to build and publish (all, backend, or frontend)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # Mandatory quality gates (spec 002). Called here so no image is published
  # unless every gate passes.
  quality-gates:
    name: Quality gates
    uses: ./.github/workflows/quality-gates.yml

  preflight-checks:
    name: Lint & Preflight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint module imports
        run: npm run lint:imports

      - name: Build and validate frontend web bundle
        run: |
          cd frontend
          EXPO_PUBLIC_API_BASE_URL= npm run web:export

      - name: Upload frontend web bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  publish-backend:
    name: Build & Publish Backend
    needs: [preflight-checks, quality-gates]
    if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Project PN backend API
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Oracle Cloud Ampere needs arm64; keep amd64 for local/x86 runners.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Summary & Print Result
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend:${SHORT_SHA:0:7}"
          LATEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend:latest"
          DIGEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend@${{ steps.build.outputs.digest }}"

          echo ""
          echo "============================================================"
          echo " Backend Image Published Successfully:"
          echo "   Tag:    ${IMAGE_URL}"
          echo "   Latest: ${LATEST_URL}"
          echo "   Digest: ${DIGEST_URL}"
          echo "============================================================"
          echo ""

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📦 Backend Image Published
          - **Tag URL**: \`${IMAGE_URL}\`
          - **Latest URL**: \`${LATEST_URL}\`
          - **Digest**: \`${DIGEST_URL}\`
          EOF

  publish-frontend:
    name: Build & Publish Frontend
    needs: [preflight-checks, quality-gates]
    if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download frontend web bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract frontend image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Project PN frontend (Expo web / nginx)
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summary & Print Result
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend:${SHORT_SHA:0:7}"
          LATEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend:latest"
          DIGEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend@${{ steps.build.outputs.digest }}"

          echo ""
          echo "============================================================"
          echo " Frontend Image Published Successfully:"
          echo "   Tag:    ${IMAGE_URL}"
          echo "   Latest: ${LATEST_URL}"
          echo "   Digest: ${DIGEST_URL}"
          echo "============================================================"
          echo ""

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📦 Frontend Image Published
          - **Tag URL**: \`${IMAGE_URL}\`
          - **Latest URL**: \`${LATEST_URL}\`
          - **Digest**: \`${DIGEST_URL}\`
          EOF
