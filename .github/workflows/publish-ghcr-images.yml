name: Publish Project PN images

# Publishes backend + frontend images to GHCR on every push to main.
#
# Auth: prefer repo secret GHCR_TOKEN (PAT with write:packages). GITHUB_TOKEN
# alone fails for packages that were created outside Actions without
# "Inherit access from repository" / Manage Actions access Write on the
# package (seen as permission_denied: read_package on project-pn-frontend).
# Keep OCI source labels so packages stay linked to this repo.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Project PN backend API

      - name: Build and publish backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Oracle Cloud Ampere needs arm64; keep amd64 for local/x86 runners.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary & Print Result
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend:${SHORT_SHA:0:7}"
          LATEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend:latest"
          DIGEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-backend@${{ steps.build.outputs.digest }}"

          echo ""
          echo "============================================================"
          echo " Backend Image Published Successfully:"
          echo "   Tag:    ${IMAGE_URL}"
          echo "   Latest: ${LATEST_URL}"
          echo "   Digest: ${DIGEST_URL}"
          echo "============================================================"
          echo ""

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📦 Backend Image Published
          - **Tag URL**: \`${IMAGE_URL}\`
          - **Latest URL**: \`${LATEST_URL}\`
          - **Digest**: \`${DIGEST_URL}\`
          EOF

  publish-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend web bundle
        run: |
          npm ci --legacy-peer-deps
          cd frontend
          EXPO_PUBLIC_API_BASE_URL= EXPO_PUBLIC_CENTRAL_AUTH_URL=https://auth.nacfson.cloud npm run web:export

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract frontend image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Project PN frontend (Expo web / nginx)

      - name: Build and publish frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary & Print Result
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend:${SHORT_SHA:0:7}"
          LATEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend:latest"
          DIGEST_URL="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/project-pn-frontend@${{ steps.build.outputs.digest }}"

          echo ""
          echo "============================================================"
          echo " Frontend Image Published Successfully:"
          echo "   Tag:    ${IMAGE_URL}"
          echo "   Latest: ${LATEST_URL}"
          echo "   Digest: ${DIGEST_URL}"
          echo "============================================================"
          echo ""

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📦 Frontend Image Published
          - **Tag URL**: \`${IMAGE_URL}\`
          - **Latest URL**: \`${LATEST_URL}\`
          - **Digest**: \`${DIGEST_URL}\`
          EOF
